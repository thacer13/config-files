# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,preferred,auto,1
# monitor=eDP-1,1920x1080@144,0x0,1


# Set programs that you use
$terminal = kitty
$fileManager = nautilus
$browser = firefox

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:
# exec-once = nm-applet &

exec-once = systemctl --user start hyprpolkitagent
exec-once = hyprpaper
exec-once = hyprctl setcursor Bibata-Modern-Classic 24
exec-once = waybar
exec-once = dunst
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = otd-daemon
exec-once = nohup easyeffects --gapplication-service
exec-once = gammastep -O 3333

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 0
    gaps_out = 0

    border_size = 4

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(7fbbb3ee) rgba(83c092ee) 45deg
    col.inactive_border = rgba(313244ee)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
layerrule {
  name = layerrule-1
  no_anim = on
  blur = on
  match:namespace = rofi
}


# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true # You probably want this
}

scrolling {
  fullscreen_on_one_column = true
  focus_fit_method = 1
  column_width = 0.9
  follow_focus = true
  direction = down
  follow_min_visible = 0.6
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 2 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
    disable_splash_rendering = true
}

source = ~/.config/hypr/keyboard.conf # Input settings & shortcuts
source = ~/.config/hypr/functions-gestures.conf # Gestures & Fn functionality
source = ~/.config/hypr/decorations.conf 
source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/windowrules.conf
